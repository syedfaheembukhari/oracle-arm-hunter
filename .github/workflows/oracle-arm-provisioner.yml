name: Oracle ARM Auto-Provisioner

on:
  schedule:
    # Runs at off-peak minutes (7 and 37 past every hour) to bypass GitHub queue delays
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-arm-hunter
  cancel-in-progress: false

jobs:
  hunt-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI Credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/.oci"
          printf "%s\n" "$OCI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat << EOF > "$HOME/.oci/config"
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          key_file=${HOME}/.oci/oci_api_key.pem
          tenancy=ocid1.tenancy.oc1..aaaaaaaasp5nspa7btyxazrbxyikoy7dye64rdpn2m2e7ztb4uffag7iubia
          region=ap-hyderabad-1
          EOF
          chmod 600 "$HOME/.oci/config"

          echo "🔍 Validating OCI Authentication..."
          oci iam region-subscription list --query "data[0].\"region-name\"" --raw-output || echo "Auth check finished"

      - name: Check Existing Instance or Hunt Capacity
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set +e

          TENANCY="ocid1.tenancy.oc1..aaaaaaaasp5nspa7btyxazrbxyikoy7dye64rdpn2m2e7ztb4uffag7iubia"
          COMPARTMENT="ocid1.tenancy.oc1..aaaaaaaasp5nspa7btyxazrbxyikoy7dye64rdpn2m2e7ztb4uffag7iubia"
          AD="WlOh:AP-HYDERABAD-1-AD-1"
          SHAPE="VM.Standard.A1.Flex"
          IMAGE_ID="ocid1.image.oc1.ap-hyderabad-1.aaaaaaaacx5cw6qxwnemznb2wojrfdbkuepvgwzlwzqa2snxqslops3nmlua"
          SUBNET_ID="ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaae5l27ilikl2fkkls6p3pzz56igaz77jgnrowmrpmbrn6ieif4l4q"
          NAME="snookerops-prod"

          # 1. Check if instance already exists
          EXISTING_STATE=$(oci compute instance list \
            --compartment-id "$COMPARTMENT" \
            --display-name "$NAME" \
            --query "data[?\"lifecycle-state\"!='TERMINATED'] | [0].\"lifecycle-state\"" \
            --raw-output 2>/dev/null)

          if [ "$EXISTING_STATE" = "RUNNING" ] || [ "$EXISTING_STATE" = "PROVISIONING" ] || [ "$EXISTING_STATE" = "STARTING" ]; then
            echo "🎉 Instance $NAME is ALREADY ACTIVE (State: $EXISTING_STATE)!"
            INSTANCE_ID=$(oci compute instance list --compartment-id "$COMPARTMENT" --display-name "$NAME" --query "data[0].id" --raw-output 2>/dev/null)
            PUBLIC_IP=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --query "data[0].\"public-ip\"" --raw-output 2>/dev/null || echo "Pending")
            echo "🌐 Public IP: $PUBLIC_IP"
            echo "SSH Connect: ssh -i ~/.ssh/oracle_snookerops_key ubuntu@$PUBLIC_IP"
            exit 0
          fi

          echo "🚀 Starting continuous capacity hunt loop (32 minutes per run)..."
          START_TIME=$(date +%s)
          ATTEMPT=0

          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # Run for 32 minutes (~1920 seconds) then hand over cleanly to next cycle
            if [ $ELAPSED -ge 1920 ]; then
              echo "⏱️ 32-minute hunt cycle completed. Next scheduled cycle will take over."
              exit 0
            fi

            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            echo "[$TIMESTAMP] Attempt #$ATTEMPT..."

            RESULT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT" \
              --availability-domain "$AD" \
              --shape "$SHAPE" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --display-name "$NAME" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 100 \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBLIC_KEY\"}" \
              --wait-for-state RUNNING \
              --max-wait-seconds 300 2>&1)

            if echo "$RESULT" | grep -q '"lifecycle-state": "RUNNING"'; then
              echo ""
              echo "🎉🎉🎉 SUCCESS! ARM INSTANCE PROVISIONED AND RUNNING! 🎉🎉🎉"
              INSTANCE_ID=$(echo "$RESULT" | grep -o '"id": "[^"]*"' | head -1 | cut -d'"' -f4)
              sleep 5
              PUBLIC_IP=$(oci compute instance list-vnics --instance-id "$INSTANCE_ID" --query "data[0].\"public-ip\"" --raw-output 2>/dev/null || echo "")
              echo "🌐 Public IP Address: $PUBLIC_IP"
              echo "Connect using: ssh -i ~/.ssh/oracle_snookerops_key ubuntu@$PUBLIC_IP"
              exit 0
            elif echo "$RESULT" | grep -qi "out of.*capacity\|out of host capacity\|InternalError\|LimitExceeded"; then
              echo "   ⏳ Out of capacity in Hyderabad right now. Retrying in 45s..."
            elif echo "$RESULT" | grep -qi "TooManyRequests"; then
              echo "   ⚠️ Rate limited by Oracle. Waiting 75s..."
              sleep 45
            else
              echo "   ℹ️ OCI Output: $(echo "$RESULT" | grep -E '"message"|"code"' | head -4)"
              echo "   Retrying in 45s..."
            fi

            sleep 45
          done
