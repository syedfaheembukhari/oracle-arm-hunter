name: Oracle ARM Auto-Provisioner

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: oracle-arm-hunter
  cancel-in-progress: false

jobs:
  hunt-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --upgrade pip
          pip install oci-cli

      - name: Configure OCI Credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p "$HOME/.oci"
          printf "%s\n" "$OCI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          # FIX: SSH key goes into a file (no more broken JSON from newlines)
          printf "%s\n" "$SSH_PUBLIC_KEY" > "$HOME/ssh_key.pub"

          cat << EOF > "$HOME/.oci/config"
          [DEFAULT]
          user=${OCI_USER_OCID}
          fingerprint=${OCI_FINGERPRINT}
          key_file=${HOME}/.oci/oci_api_key.pem
          tenancy=ocid1.tenancy.oc1..aaaaaaaasp5nspa7btyxazrbxyikoy7dye64rdpn2m2e7ztb4uffag7iubia
          region=ap-hyderabad-1
          EOF
          chmod 600 "$HOME/.oci/config"

          # FIX: if login is broken, STOP here with a red X instead of looping for 5 hours
          echo "Checking OCI login..."
          oci iam region-subscription list --query "data[0].\"region-name\"" --raw-output
          echo "Login OK"

      - name: Check Existing Instance or Hunt Capacity
        run: |
          set +e

          COMPARTMENT="ocid1.tenancy.oc1..aaaaaaaasp5nspa7btyxazrbxyikoy7dye64rdpn2m2e7ztb4uffag7iubia"
          AD="WlOh:AP-HYDERABAD-1-AD-1"
          SHAPE="VM.Standard.A1.Flex"
          IMAGE_ID="ocid1.image.oc1.ap-hyderabad-1.aaaaaaaacx5cw6qxwnemznb2wojrfdbkuepvgwzlwzqa2snxqslops3nmlua"
          SUBNET_ID="ocid1.subnet.oc1.ap-hyderabad-1.aaaaaaaae5l27ilikl2fkkls6p3pzz56igaz77jgnrowmrpmbrn6ieif4l4q"
          NAME="snookerops-prod"

          # FIX: any instance that isn't TERMINATED counts (STOPPED too),
          # so we never create a second one and go over the free limit
          check_existing() {
            oci compute instance list \
              --compartment-id "$COMPARTMENT" \
              --display-name "$NAME" \
              --query "data[?\"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'] | [0].\"lifecycle-state\"" \
              --raw-output 2>/dev/null
          }

          START_TIME=$(date +%s)
          ATTEMPT=0

          while true; do
            # FIX: check before EVERY attempt, not just once at the start
            STATE=$(check_existing)
            if [ -n "$STATE" ] && [ "$STATE" != "null" ]; then
              echo "Instance $NAME already exists (State: $STATE). Nothing to do."
              echo "Get the public IP from the Oracle console: Compute > Instances."
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ $ELAPSED -ge 18000 ]; then
              echo "5-hour session done. Next scheduled run will continue."
              exit 0
            fi

            echo "[$(date '+%H:%M:%S')] Attempt #$ATTEMPT (Elapsed: $((ELAPSED / 60))m)"

            # FIX: no --wait-for-state. Waiting could time out AFTER Oracle accepted
            # the request, and the old script would then launch a duplicate.
            RESULT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT" \
              --availability-domain "$AD" \
              --shape "$SHAPE" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --display-name "$NAME" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --boot-volume-size-in-gbs 100 \
              --ssh-authorized-keys-file "$HOME/ssh_key.pub" 2>&1)

            if echo "$RESULT" | grep -q '"lifecycle-state"'; then
              echo "SUCCESS! Oracle accepted the request. Instance is being created."
              echo "Check Compute > Instances in the Oracle console in 2-3 minutes for the public IP."
              exit 0
            elif echo "$RESULT" | grep -qi "out of host capacity\|out of capacity"; then
              echo "   Out of capacity. Retrying in 60s..."
              sleep 60
            elif echo "$RESULT" | grep -qi "TooManyRequests"; then
              echo "   Rate limited. Waiting 120s..."
              sleep 120
            elif echo "$RESULT" | grep -qi "LimitExceeded"; then
              # FIX: this is NOT a capacity problem. Stop and show it.
              echo "LIMIT EXCEEDED - you already use your free A1 quota somewhere, or the account limit is 0."
              echo "$RESULT"
              exit 1
            else
              # FIX: show the FULL error so we can see what's really wrong
              echo "   Unexpected error:"
              echo "$RESULT" | head -20
              sleep 60
            fi
          done
